[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "realbind2-vlm-repair"
version = "0.1.0"
description = "Frozen RealBind2 VLM evaluation and repair infrastructure"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

